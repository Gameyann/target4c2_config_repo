server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
            - AddResponseHeader=X-Gateway, target4c2-api-gateway
          routes:
            - id: openapi-identity-access-service
              uri: lb://identity-access-service
              predicates:
                - Path=/v3/api-docs/identity-access-service
              filters:
                - RewritePath=/v3/api-docs/identity-access-service, /v3/api-docs
            - id: openapi-public-cms-marketing-service
              uri: lb://public-cms-marketing-service
              predicates:
                - Path=/v3/api-docs/public-cms-marketing-service
              filters:
                - RewritePath=/v3/api-docs/public-cms-marketing-service, /v3/api-docs
            - id: openapi-learning-content-service
              uri: lb://learning-content-service
              predicates:
                - Path=/v3/api-docs/learning-content-service
              filters:
                - RewritePath=/v3/api-docs/learning-content-service, /v3/api-docs
            - id: openapi-training-pedagogy-service
              uri: lb://training-pedagogy-service
              predicates:
                - Path=/v3/api-docs/training-pedagogy-service
              filters:
                - RewritePath=/v3/api-docs/training-pedagogy-service, /v3/api-docs
            - id: openapi-commerce-operation-service
              uri: lb://commerce-operation-service
              predicates:
                - Path=/v3/api-docs/commerce-operation-service
              filters:
                - RewritePath=/v3/api-docs/commerce-operation-service, /v3/api-docs
            - id: identity-access-service
              uri: lb://identity-access-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**,/api/v1/permissions/**,/api/v1/security/**,/api/v1/candidate/**
            - id: public-cms-marketing-service
              uri: lb://public-cms-marketing-service
              predicates:
                - Path=/api/v1/public/**,/api/v1/cms/**,/api/v1/marketing/**,/api/v1/media/public/**
            - id: learning-content-service
              uri: lb://learning-content-service
              predicates:
                - Path=/api/v1/learning/**,/api/v1/catalog/**,/api/v1/courses/**,/api/v1/lessons/**,/api/v1/quizzes/**,/api/v1/content-media/**
            - id: training-pedagogy-service
              uri: lb://training-pedagogy-service
              predicates:
                - Path=/api/v1/training/**,/api/v1/classes/**,/api/v1/sessions/**,/api/v1/assignments/**,/api/v1/evaluations/**,/api/v1/teacher/**
            - id: commerce-operation-service
              uri: lb://commerce-operation-service
              predicates:
                - Path=/api/v1/commerce/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/subscriptions/**,/api/v1/coupons/**,/api/v1/operations/**,/api/v1/reports/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}

target4c2:
  identity:
    jwt-secret: ${JWT_SECRET:target4c2-local-development-secret-key-change-me-256-bits}
  gateway:
    rate-limit:
      enabled: true
      replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH:100}
      burst-capacity: ${GATEWAY_RATE_LIMIT_BURST:200}
    public-paths:
      - /api/v1/public/**
      - /api/v1/auth/**
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /actuator/health

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: "Identity & Access"
    urls:
      - name: "Identity & Access"
        url: /v3/api-docs/identity-access-service
      - name: "Vitrine Publique / CMS Marketing"
        url: /v3/api-docs/public-cms-marketing-service
      - name: "Learning Content"
        url: /v3/api-docs/learning-content-service
      - name: "Training & Pedagogy"
        url: /v3/api-docs/training-pedagogy-service
      - name: "Commerce & Operations"
        url: /v3/api-docs/commerce-operation-service
