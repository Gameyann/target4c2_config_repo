management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.yann: INFO

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

spring:
  cloud:
    config:
      fail-fast: true
  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

target4c2:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    s3:
      endpoint: ${AWS_S3_ENDPOINT:}
      path-style-access-enabled: false
  mail:
    from: ${MAIL_FROM}
